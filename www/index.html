<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>

    <!-- Particle js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js"
        type="text/javascript"></script>

    <style>
        /* Added output text style */
        .output-text {
            color: white;
            text-align: center;
            font-size: 22px;
            margin-top: 20px;
            font-family: "Poppins", sans-serif;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .output-text.visible {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 🌐 Main Screen -->
        <section id="Oval" class="m-0 p-0">
            <div class="row">
                <div class="col-md-1"></div>

                <div class="col-md-10">
                    <div class="main-container">
                        <canvas id="canvasOne" width="700" height="420"></canvas>

                        <div id="JarvisHood">
                            <div id="square">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <h5>Ask me anything...</h5>
                            <!-- Removed duplicate output area -->
                        </div>
                    </div>
                </div>

                <div class="col-md-12 mt-3 pt-3">
                    <div class="text-center">
                        <div id="TextInput" class="d-flex">
                            <input type="text" class="input-field" name="chatbox" id="chatbox"
                                placeholder="type here...">
                            <button id="SendBtn" class="glow-on-hover"><i class="bi bi-send"></i></button>
                            <button id="MicBtn" class="glow-on-hover"><i class="bi bi-mic"></i></button>
                            <button id="SettingsBtn" class="glow-on-hover"><i class="bi bi-gear"></i></button>
                        </div>
                    </div>
                </div>

                <div class="col-md-1"></div>
            </div>
        </section>

        <!-- 🎤 SiriWave Section -->
        <section id="SiriWave" hidden>
            <div class="siriwave-wrapper">
                <p class="siri-text" id="status-text">Listening...</p>
                <p class="output-text" id="output-text"></p>
                <div id="siri-container"></div>
            </div>
        </section>
    </div>
    

    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.11.2/jquery-ui.min.js"></script>

    <!-- Text Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lettering.js/0.7.0/jquery.lettering.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/textillate/0.4.0/jquery.textillate.min.js"></script>

    <!-- SiriWave library -->
    <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>

    <!-- Eel bridge -->
    <script src="/eel.js"></script>

    <!-- Custom Scripts -->
    <script src="main.js"></script>
    <script src="controller.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
